# ─────────────────────────────────────────────────────
# PR Title — lint tiêu đề PR bằng commitlint.config.ts
#
# Feature vào develop và main bằng merge commit: dòng đầu là
# `Merge pull request #N …` (analyzer bỏ qua), tiêu đề PR chỉ nằm trong body.
# Header của các commit trong nhánh mới quyết định release (lint trong ci.yml).
# Check này giữ tiêu đề PR dễ đọc và khớp với header đó.
# `edited` bắt được cả khi chỉ sửa tiêu đề (ci.yml không chạy lại khi đó).
# ─────────────────────────────────────────────────────
name: PR Title

on:
  pull_request:
    branches: [main, develop, "release/**"]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: PR title (commitlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: yarn install --immutable

      - name: Lint PR title
        # The title goes through env, never interpolated into the script, so a
        # crafted title cannot inject shell. commitlint.pr-title.config.ts turns
        # off the default ignores, so `Revert "…"` / `Merge …` titles fail too.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | yarn commitlint --config commitlint.pr-title.config.ts --verbose
