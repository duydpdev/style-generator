name: CI Check

on:
  pull_request:
    branches: [main, develop, "release/**"]
    types: [opened, synchronize, reopened]

# Cancel any in-progress run for the same PR when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions: only read repo contents (no write access needed for CI checks).
permissions:
  contents: read

jobs:
  check:
    name: Build & Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Draft PRs run CI too (a pushed draft must not stay without a result;
    # Actions minutes are free on this public repo). No paths filter here:
    # the site build renders documents/*.md, so docs-only PRs still need
    # this job, and the required check must always report.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit production dependencies
        # Hard gate: anything a consumer installs with the package.
        run: yarn npm audit --recursive --severity high --environment production

      - name: Audit all dependencies (report only)
        # Dev tooling, examples and the site are not shipped; log, never fail.
        run: yarn npm audit --all --recursive || true

      - name: Commitlint (PR commits)
        # A feature is cut from main and lands on develop and on main as the
        # same commits (merge commits, never squash), so base..head is exactly
        # the feature's commits for either base. Their headers decide the
        # release, so lint every one of them.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Linting commits $BASE_SHA..$HEAD_SHA"
          yarn commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Build
        run: yarn build:all

      - name: Prepare nuxt-v4 types
        # ESLint lints examples/nuxt-v4/app/**, whose tsconfig references
        # .nuxt/tsconfig.*.json. `nuxt prepare` writes them and needs dist/
        # (nuxt.config.ts imports the built library), so it runs after Build.
        run: yarn workspace nuxt-v4-example prepare:nuxt

      - name: Prepare plain-nuxt types
        # Same as above for examples/plain-nuxt/app/**.
        run: yarn workspace plain-nuxt-example prepare:nuxt

      - name: Lint
        # Type-aware ESLint also covers examples/**, which import the built
        # library through `link:../..`; without dist/ their types are unresolved.
        run: yarn lint

      - name: Prettier check
        run: yarn prettier:check

      - name: Type Check
        run: yarn tsc --noEmit

      - name: Script syntax and type check
        # tsconfig.scripts.json: checkJs over scripts/ and site/scripts/.
        run: |
          for f in scripts/*.mjs site/scripts/*.mjs; do
            node --check "$f"
          done
          yarn typecheck:scripts

      - name: Build site
        # site/ and examples/react-v4 dogfood the library through `link:` deps,
        # and the site renders documents/*.md, so this runs for docs-only PRs too.
        # It is the only check that builds them; nothing deploys the site.
        run: yarn workspace site build

      - name: Check doc links
        # Relative links and #anchors in the markdown the site renders.
        run: yarn workspace site check:links

      - name: Check embedded doc code
        # Tutorial blocks with an `<!-- embed: path#region -->` marker must
        # equal that region of the real example file (yarn docs:embed).
        run: yarn check:docs-embed

      - name: Type-check doc snippets
        # Every ts/tsx block in README.md and documents/ (not plans,
        # brainstorm, migration) against dist/*.d.ts; opt-outs need a reason
        # and stay at or below 10% of all blocks.
        run: yarn check:doc-snippets

      - name: Check reference coverage of exports
        # Every export of every package.json#exports subpath needs a heading
        # in documents/reference/<subpath>.md with a signature block that
        # matches dist/*.d.ts and a non-empty TSDoc (yarn docs:signatures).
        run: yarn check:doc-exports

      - name: Typecheck examples
        # The examples and the site consume the built library through `link:../..`.
        run: yarn workspaces foreach -A --include '*-example' --include site run typecheck

      - name: Test examples (design-system DX)
        # Compiles the recipes against a mutated theme.json and expects the
        # error in src/recipes/button.ts; needs dist/*.d.ts from the build.
        run: yarn workspace design-system-example test

      - name: Build examples
        # react-v4 is already built by the site build above.
        run: |
          yarn workspace next-v4-example build
          yarn workspace nuxt-v4-example build
          yarn workspace plain-react-example build
          yarn workspace plain-nuxt-example build
          yarn workspace plain-nuxt-example generate

      - name: Check plain UI folders
        # examples/plain-react/src/ui/<folder>/ holds style.ts, types.ts, <Name>.tsx
        # and index.ts, and imports only ./…, ../../theme and its package allow-list (scripts/check-plain-ui.mjs).
        run: yarn check:plain-ui

      - name: Check externals
        run: yarn check:externals

      - name: Check browser-safe subpaths
        run: yarn check:browser-safe

      - name: Check size budgets
        run: yarn check:sizes

      - name: Smoke-run built artifacts
        # Loads every subpath via import + require and runs the CLI,
        # including `init` (stack detection) and `generate` in a fresh project.
        run: yarn check:smoke

      - name: Check types resolve for ESM and CJS (attw, node16 profile)
        # Packs the package and runs @arethetypeswrong/cli on the tarball;
        # needs dist/*.d.cts from `yarn build:all`.
        run: yarn check:types-pack

      - name: Vite dev-server smoke (styleGenVite configureServer)
        # `vite build` never runs configureServer; this edits the example
        # theme under a real dev server and expects a re-emit + full-reload.
        run: node scripts/vite-dev-smoke.mjs

      - name: Type-check dist/*.d.ts (ESM, Bundler) and dist/*.d.cts (CJS, node16) with library checking on
        # tsconfig.dts-check.json and tsconfig.dts-check.cjs.json; attw
        # (above) never resolves peer types. The examples set skipLibCheck.
        run: yarn typecheck:dist

      - name: Test (with coverage thresholds)
        # vitest.config.ts coverage.thresholds fail the step if coverage drops.
        run: yarn test:coverage

      - name: Type tests
        run: yarn test:types

  # examples/plain-react: the stories run as Vitest browser tests (project
  # `storybook`), the plain-vs-harness class parity gate (project `parity`)
  # compares the six shared components with react-v4-example/ui, and a copied
  # src/ui/button/ type-checks against the packed tarball and its peers only.
  # The workspace scripts run `style-gen generate` first, so dist/ must be
  # built. A job of its own (not a step of `check`) with no paths filter and
  # no draft skip, so it reports on every PR like `check`; its name is the
  # check the `main-develop` ruleset requires.
  plain-react:
    name: Plain React (Storybook + parity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORYBOOK_DISABLE_TELEMETRY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Stories and parity gate (Vitest browser)
        run: yarn workspace plain-react-example test

      - name: Copy-out smoke (packed tarball + peers only)
        run: node examples/plain-react/scripts/copy-out-smoke.mjs
