# Nightly legs the Ubuntu-only CI never runs. Not a required check.
#   macos: `yarn test` on macos-latest (case-insensitive filesystem cases of
#          sameFile, FSEvents behaviour of the real-chokidar watcher tests).
#   bun:   scripts/bun-smoke.mjs installs the packed tarball with Bun and runs
#          the CLI file and generate() under it.
# Runs every night, on manual dispatch, and on PRs into main/release/** that
# change this workflow or the smoke script.
name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - ".github/workflows/nightly.yml"
      - "scripts/bun-smoke.mjs"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Unit tests
        run: yarn test

  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Install Bun
        # GitHub-owned actions only: install Bun from npm, pinned.
        run: npm install -g bun@1.3.14

      - name: Bun smoke
        run: node scripts/bun-smoke.mjs
