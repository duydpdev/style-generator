version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Dependabot cuts its branch from the target branch. A feature must be cut
    # from main (documents/deploy.md), so target main: the branch is then a
    # clean feature branch. Land it on develop first with a second PR from the
    # same branch (`gh pr create --base develop --head <dependabot branch>`),
    # then merge Dependabot's own PR into main.
    target-branch: main
    schedule:
      interval: monthly
    # No automatic rebase: every rebase re-runs the whole CI on the PR.
    # Comment `@dependabot rebase` on the PR to update it before landing.
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      # Trailing space on purpose: GitHub inserts a colon after a prefix that
      # ends with `]`, and `[ci]: bump …` fails the `[type] subject` header rule
      # that the PR title check and commitlint enforce.
      prefix: "[ci] "

  - package-ecosystem: npm
    directory: /
    # Same flow as github-actions above: branch from main, land on develop
    # first. Covers the root package and every workspace in the lockfile.
    target-branch: main
    schedule:
      interval: monthly
    # Same as github-actions above.
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      # Report §3.6 item 4: every minor/patch bump in ONE PR. Majors are not
      # grouped, so each gets its own PR (the ignore list below still drops
      # the hand-managed majors).
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors that change a supported range are done by hand: the Tailwind
      # and Zod lines (tailwind-floor leg) and the vite/typescript peers
      # (peer matrix, CI-05). Minor and patch bumps still come through.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      # `[ci]` cuts no release. The root's runtime ranges are carets, so an
      # in-range bump only moves yarn.lock, which is not published: consumers
      # resolve their own versions. A bump that changes a published range
      # (package.json `dependencies`/`peerDependencies`) must be retitled to
      # `[fix]`/`[feat]` before merging so the new range is released.
      prefix: "[ci] "
