# ─────────────────────────────────────────────────────
# Back-merge — Merge main ngược về develop sau khi release stable
#
# Reusable workflow, được gọi từ release.yml
# Chỉ chạy khi release stable tag trên main
# Commit message chứa [skip ci] để KHÔNG tạo tag mới trên develop
# ─────────────────────────────────────────────────────
name: Back-merge

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  back-merge:
    name: Merge main into develop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.CI_WORKER_REPOSITORY_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # No `-X theirs`: it resolves every conflicting hunk to main's side, which
      # silently drops develop's newer code when a hotfix on main touched the
      # same lines. Normally main only holds develop's commits plus the release
      # commit, so this merge is clean; a conflict means a human must look.
      - name: Merge main into develop
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main
          if ! git merge origin/main --no-edit \
            -m "[chore] merge main (${VERSION}) into develop [skip ci]"; then
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U
            git merge --abort || true
            echo "::error::Back-merge of ${VERSION} conflicts. The release and publish already succeeded; merge main into develop by hand: git switch develop && git merge origin/main -m \"[chore] merge main (${VERSION}) into develop [skip ci]\", resolve, push."
            exit 1
          fi

      - name: Push
        run: git push origin develop
