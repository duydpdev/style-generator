# ─────────────────────────────────────────────────────
# Release — Main orchestrator
#
# Trigger: push to main or develop
# Flow:
#   1. Semantic-release creates the tag & version bump
#   2. Detect the new tag (compare before/after)
#   3. Call deploy.yml to build & publish to GitHub Packages
#   4. Call back-merge.yml after every push to main (even when there is no release)
# ─────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main, develop]

# Least privilege for the built-in GITHUB_TOKEN: read by default, and only
# `deploy` widens it. `release` and `back-merge` push with the
# CI_WORKER_REPOSITORY_TOKEN PAT (checkout `token:` + semantic-release env), so
# they never write through GITHUB_TOKEN. A reusable workflow's token can never
# exceed its caller job's grant, so `deploy` grants `packages: write` here.
# `@semantic-release/github` has its issue/PR comments and labels disabled,
# so no job needs `issues`/`pull-requests`.
permissions:
  contents: read

# One release run per branch at a time. A running release is never cancelled
# (that could leave a tag pushed without its publish); GitHub keeps one pending
# run per group, so a newer push replaces an older pending one, and that newer
# run releases a superset of the commits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Create tag ────────────────────────────────────
  release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_release_published: ${{ steps.check.outputs.new_release_published }}
      new_release_tag: ${{ steps.check.outputs.new_release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_WORKER_REPOSITORY_TOKEN }}
          # Keep the PAT out of .git/config while dependency install scripts
          # run. semantic-release puts GITHUB_TOKEN into the URL of every
          # fetch/push it makes, and the steps below run no remote git command.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        # Semantic Release commits the changelog; local git hooks must not run in CI.
        env:
          HUSKY: "0"
        run: yarn install --immutable

      # Nothing blocks a merge while CI is red (GitHub Free, no branch
      # protection), so test the pushed commit before a tag is cut for it.
      - name: Test
        run: yarn test

      - name: Type tests
        run: yarn test:types

      - name: Save tags before release
        run: git tag --list 'v*' | sort > /tmp/tags_before.txt

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.CI_WORKER_REPOSITORY_TOKEN }}
        run: yarn release

      # This run's tag is a tag on HEAD that did not exist before
      # semantic-release ran and matches this branch's channel. semantic-release
      # fetches every remote tag first, so a tag that another branch's run
      # pushed meanwhile also appears locally; only a tag on HEAD can be ours.
      # `--points-at HEAD` holds on main because @semantic-release/git commits
      # the release (release.config.cjs) and semantic-release re-reads HEAD
      # after each prepare plugin, so it tags that release commit, the local
      # HEAD. On develop nothing is committed and the tag sits on GITHUB_SHA.
      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            CHANNEL='^v[0-9]+\.[0-9]+\.[0-9]+$'
          else
            CHANNEL='^v[0-9]+\.[0-9]+\.[0-9]+-DEV\.[0-9]+$'
          fi
          git tag --points-at HEAD --list 'v*' | sort > /tmp/tags_head.txt
          NEW_TAGS=$(comm -13 /tmp/tags_before.txt /tmp/tags_head.txt | grep -E "$CHANNEL" || true)
          COUNT=$(printf '%s' "$NEW_TAGS" | grep -c . || true)
          case "$COUNT" in
            0)
              echo "new_release_published=false" >> "$GITHUB_OUTPUT"
              echo "ℹ️ No new release"
              # semantic-release exits 0 without releasing when the branch moved
              # on the remote during the run; the run for the newer push releases.
              REMOTE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha 2>/dev/null || true)
              if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
                echo "::warning::origin/$GITHUB_REF_NAME is at $REMOTE_SHA, not $GITHUB_SHA: semantic-release may have skipped this run as behind its remote. The run for the newer push releases those commits."
              fi
              ;;
            1)
              echo "new_release_published=true" >> "$GITHUB_OUTPUT"
              echo "new_release_tag=$NEW_TAGS" >> "$GITHUB_OUTPUT"
              echo "✅ New release: $NEW_TAGS"
              ;;
            *)
              echo "::error::More than one new $GITHUB_REF_NAME tag on HEAD: $(echo $NEW_TAGS). Publish the right one by hand (documents/deploy.md, publish a pushed but unpublished tag)."
              exit 1
              ;;
          esac

  # ── 2. Build & Publish ────────────────────────────
  deploy:
    name: Deploy
    needs: release
    permissions:
      contents: read
      packages: write
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.new_release_tag }}
    # No `secrets: inherit`: deploy publishes with the built-in GITHUB_TOKEN,
    # which every called workflow receives, and must not see the write PAT.

  # ── 3. Back-merge (every push to main, with or without a release) ──
  # Features land on develop and main separately, so a push to main that cuts
  # no release (a [ci]/[docs] feature) still leaves main ahead of develop.
  # Run after every successful release job on main; deploy may be skipped (no
  # tag) but must not have failed.
  back-merge:
    name: Back-merge
    needs: [release, deploy]
    permissions:
      contents: read
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.release.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.deploy.result)
    uses: ./.github/workflows/back-merge.yml
    with:
      version: ${{ needs.release.outputs.new_release_tag }}
    secrets: inherit
