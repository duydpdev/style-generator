name: CI Check

on:
  pull_request:
    branches: [main, develop, "release/**"]

# Cancel any in-progress run for the same PR when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions: only read repo contents (no write access needed for CI checks).
permissions:
  contents: read

jobs:
  check:
    name: Build & Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit production dependencies
        # Hard gate: anything a consumer installs with the package.
        run: yarn npm audit --recursive --severity high --environment production

      - name: Audit all dependencies (report only)
        # Dev tooling, examples and the site are not shipped; log, never fail.
        run: yarn npm audit --all --recursive || true

      - name: Commitlint (PR commits)
        # A feature is cut from main and lands on develop and on main as the
        # same commits (merge commits, never squash), so base..head is exactly
        # the feature's commits for either base. Their headers decide the
        # release, so lint every one of them.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Linting commits $BASE_SHA..$HEAD_SHA"
          yarn commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Build
        run: yarn build:all

      - name: Lint
        # Type-aware ESLint also covers examples/**, which import the built
        # library through `link:../..`; without dist/ their types are unresolved.
        run: yarn lint

      - name: Prettier check
        run: yarn prettier:check

      - name: Type Check
        run: yarn tsc --noEmit

      - name: Script syntax and type check
        # tsconfig.scripts.json: checkJs over scripts/ and site/scripts/.
        run: |
          for f in scripts/*.mjs site/scripts/*.mjs; do
            node --check "$f"
          done
          yarn typecheck:scripts

      - name: Build site
        # site/ and examples/react-v4 dogfood the library through `link:` deps,
        # and the site renders documents/*.md, so this runs for docs-only PRs too.
        # It is the only check that builds them; nothing deploys the site.
        run: yarn workspace site build

      - name: Check doc links
        # Relative links and #anchors in the markdown the site renders.
        run: yarn workspace site check:links

      - name: Typecheck examples
        # The examples consume the built library through `link:../..`.
        run: yarn workspaces foreach -A --include '*-example' run typecheck

      - name: Test examples (design-system DX)
        # Compiles the recipes against a mutated theme.json and expects the
        # error in src/recipes/button.ts; needs dist/*.d.ts from the build.
        run: yarn workspace design-system-example test

      - name: Build examples
        # react-v4 is already built by the site build above.
        run: |
          yarn workspace next-v4-example build
          yarn workspace nuxt-v4-example build

      - name: Check externals
        run: yarn check:externals

      - name: Check browser-safe subpaths
        run: yarn check:browser-safe

      - name: Check size budgets
        run: yarn check:sizes

      - name: Smoke-run built artifacts
        # Loads every subpath via import + require, runs the CLI and the
        # TypeScript generator script that `style-gen init` scaffolds.
        run: yarn check:smoke

      - name: Check types resolve for ESM and CJS (attw, node16 profile)
        # Packs the package and runs @arethetypeswrong/cli on the tarball;
        # needs dist/*.d.cts from `yarn build:all`.
        run: yarn check:types-pack

      - name: Vite dev-server smoke (styleGenVite configureServer)
        # `vite build` never runs configureServer; this edits the example
        # theme under a real dev server and expects a re-emit + full-reload.
        run: node scripts/vite-dev-smoke.mjs

      - name: Type-check dist/*.d.ts (ESM, Bundler) and dist/*.d.cts (CJS, node16) with library checking on
        # tsconfig.dts-check.json and tsconfig.dts-check.cjs.json; attw
        # (above) never resolves peer types. The examples set skipLibCheck.
        run: yarn typecheck:dist

      - name: Test (with coverage thresholds)
        # vitest.config.ts coverage.thresholds fail the step if coverage drops.
        run: yarn test:coverage

      - name: Type tests
        run: yarn test:types

  # e2e, tailwind-floor and node-floor cost a runner each and test built
  # output, which documents/** cannot change. Every other path counts as code.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff against the PR base
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The diff runs outside the pipe so `bash -e` aborts if it fails
        # (fail closed); an empty diff counts as code.
        run: |
          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if [ -z "$files" ] || grep -qvE '^documents/' <<<"$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only documents/** changed: e2e, tailwind-floor and node-floor are skipped."
          fi

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium webkit

      - name: Run e2e tests
        run: yarn test:e2e

  # The published peer range is `tailwindcss >=4.1.0`, but the lockfile pins
  # 4.3.0, so the floor is otherwise never exercised. This leg re-resolves the
  # Tailwind packages to the latest 4.1.x via `resolutions` (edited in this
  # runner's checkout only — the committed package.json/yarn.lock are not
  # changed) and runs the unit + e2e suites against it.
  tailwind-floor:
    name: Tailwind peer floor (4.1.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Pin Tailwind packages to the 4.1.x floor
        run: |
          jq '.resolutions += {
            "tailwindcss": "~4.1.0",
            "@tailwindcss/node": "~4.1.0",
            "@tailwindcss/vite": "~4.1.0",
            "@tailwindcss/postcss": "~4.1.0"
          }' package.json > package.json.tmp
          mv package.json.tmp package.json
          yarn install --no-immutable
          yarn why tailwindcss
          yarn why @tailwindcss/node

      - name: Build
        run: yarn build:all

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium webkit

      - name: Unit tests
        run: yarn test

      - name: E2E tests
        run: yarn test:e2e

  # `engines.node` is `^20.19.0 || >=22.12.0`, while every other job runs
  # Node 22. This leg loads the built package on the floor release: every
  # subpath via import + require (the CJS entries `require` ESM-only
  # chokidar 5, unflagged only from 20.19) and the CLI. The init-scaffolded
  # TypeScript script is skipped here; it needs Node >= 22.18.
  node-floor:
    name: Node engines floor (20.19.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Smoke-run built artifacts
        run: yarn check:smoke

  # The `vite` and `typescript` peer ranges (CI-05). Each leg re-resolves ONE
  # peer to the latest release of one major via `resolutions` (this runner's
  # checkout only), after the library is built with the committed toolchain,
  # so a red leg names exactly one major. The leg then runs what a consumer on
  # that major runs: the react-v4 example built through `styleGenVite`, a dev
  # server re-emitting on a theme edit, the example and `dist/*.d.ts`
  # type-checked and, for TypeScript, the type tests. Legs for published
  # majors must pass; `experimental` legs probe a major that is not in the
  # range yet and may fail. The `check` job covers the lockfile's Vite 7/TS 5.
  peer-matrix:
    name: Peer matrix (${{ matrix.peer }} ${{ matrix.major }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { peer: vite, major: 5 }
          - { peer: vite, major: 6 }
          - { peer: vite, major: 8 }
          - { peer: typescript, major: 6 }
          # Not published: Yarn 4.10's TypeScript compat patch cannot install
          # the native TS 7 (phase 11 follow-up).
          - { peer: typescript, major: 7, experimental: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Re-resolve ${{ matrix.peer }} to the latest ${{ matrix.major }}.x
        env:
          PEER: ${{ matrix.peer }}
          MAJOR: ${{ matrix.major }}
        run: |
          jq --arg peer "$PEER" --arg range "^$MAJOR.0.0" \
            '.resolutions[$peer] = $range' package.json > package.json.tmp
          mv package.json.tmp package.json
          yarn install --no-immutable
          yarn why "$PEER"
          # A red leg must mean "this major fails", never "the old copy ran":
          # the version seen from the root and from the example must be N.x.
          for ws in . examples/react-v4; do
            got=$(cd "$ws" && node -p "require('$PEER/package.json').version")
            echo "$ws: $PEER $got"
            case "$got" in "$MAJOR".*) ;; *) echo "::error::$ws resolved $PEER $got, expected $MAJOR.x"; exit 1 ;; esac
          done

      - name: Build the react-v4 example (styleGenVite)
        run: yarn workspace react-v4-example build

      - name: Vite dev-server smoke (styleGenVite configureServer)
        if: matrix.peer == 'vite'
        run: node scripts/vite-dev-smoke.mjs

      - name: Type-check the react-v4 example against dist
        run: yarn workspace react-v4-example typecheck

      - name: Type-check dist/*.d.ts (ESM, Bundler) and dist/*.d.cts (CJS, node16) with library checking on
        # The example sets skipLibCheck, so it never checks the package's own
        # declarations (or the vite/zod types they reference).
        run: yarn typecheck:dist

      - name: Type tests
        if: matrix.peer == 'typescript'
        run: yarn test:types
