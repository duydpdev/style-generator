cacheFolder: .yarn

injectEnvironmentFiles:
  - .env?
  - .env.local?
  - .env.development?
  - .env.production?

nodeLinker: node-modules

# Registry for installs and for `yarn npm publish`: the public npm registry, so
# no token is needed to install. CI authenticates the publish with npm trusted
# publishing (OIDC, `id-token: write`), not with a stored secret.
npmRegistryServer: "https://registry.npmjs.org"

yarnPath: .yarn/releases/yarn-4.10.3.cjs
