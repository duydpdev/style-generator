# ─────────────────────────────────────────────────────
# Drift — warn when main has commits that develop does not
#
# Back-merge (release.yml → back-merge.yml) runs after every push to main. This
# job catches the case where the back-merge failed or did not run: it fails when
# develop has been missing main's commits for over 60 minutes (the window while
# a release run is in progress is ignored).
#
# Runs daily at 06:17 UTC: an hourly schedule costs ~675 runner minutes/month
# (the job takes ~6 seconds but each run is billed as a full minute); a broken
# back-merge is reported within a day at the latest.
#
# Limitation: counting commits does not catch the "revert trap". A feature that
# was reverted on develop and then merged into main with the same SHA makes the
# back-merge bring nothing back; develop is missing code while the count stays
# 0. Only the rule `git rebase --force-rebase origin/main` before the feature
# lands again (documents/deploy.md) prevents it.
# ─────────────────────────────────────────────────────
name: Drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: develop contains main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check develop..main
        run: |
          git fetch origin main develop
          COUNT="$(git rev-list --count origin/develop..origin/main)"
          echo "main commits missing from develop: $COUNT"
          [ "$COUNT" -eq 0 ] && exit 0
          AGE=$(( $(date +%s) - $(git log -1 --format=%ct origin/main) ))
          git log --oneline origin/develop..origin/main
          if [ "$AGE" -lt 3600 ]; then
            echo "main tip is ${AGE}s old; a release/back-merge may still be running"
            exit 0
          fi
          echo "::error::develop is missing $COUNT commit(s) of main for over 60 minutes; run back-merge by hand (documents/deploy.md)"
          exit 1
