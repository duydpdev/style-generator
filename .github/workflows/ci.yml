name: CI Check

on:
  pull_request:
    branches: [main, develop, "release/**"]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel any in-progress run for the same PR when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions: only read repo contents (no write access needed for CI checks).
permissions:
  contents: read

jobs:
  check:
    name: Build & Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Draft PRs skip CI: keep a PR in draft until the local gate is green;
    # `ready_for_review` (in `on.pull_request.types`) then runs it. No paths
    # filter here: the site build renders documents/*.md, so docs-only PRs
    # still need this job.
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit production dependencies
        # Hard gate: anything a consumer installs with the package.
        run: yarn npm audit --recursive --severity high --environment production

      - name: Audit all dependencies (report only)
        # Dev tooling, examples and the site are not shipped; log, never fail.
        run: yarn npm audit --all --recursive || true

      - name: Commitlint (PR commits)
        # A feature is cut from main and lands on develop and on main as the
        # same commits (merge commits, never squash), so base..head is exactly
        # the feature's commits for either base. Their headers decide the
        # release, so lint every one of them.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Linting commits $BASE_SHA..$HEAD_SHA"
          yarn commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Build
        run: yarn build:all

      - name: Lint
        # Type-aware ESLint also covers examples/**, which import the built
        # library through `link:../..`; without dist/ their types are unresolved.
        run: yarn lint

      - name: Prettier check
        run: yarn prettier:check

      - name: Type Check
        run: yarn tsc --noEmit

      - name: Script syntax and type check
        # tsconfig.scripts.json: checkJs over scripts/ and site/scripts/.
        run: |
          for f in scripts/*.mjs site/scripts/*.mjs; do
            node --check "$f"
          done
          yarn typecheck:scripts

      - name: Build site
        # site/ and examples/react-v4 dogfood the library through `link:` deps,
        # and the site renders documents/*.md, so this runs for docs-only PRs too.
        # It is the only check that builds them; nothing deploys the site.
        run: yarn workspace site build

      - name: Check doc links
        # Relative links and #anchors in the markdown the site renders.
        run: yarn workspace site check:links

      - name: Typecheck examples
        # The examples and packages/ui-react consume the built library through `link:../..`.
        run: yarn workspaces foreach -A --include '*-example' --include '@duydpdev/ui-react' run typecheck

      - name: Test examples (design-system DX)
        # Compiles the recipes against a mutated theme.json and expects the
        # error in src/recipes/button.ts; needs dist/*.d.ts from the build.
        run: yarn workspace design-system-example test

      - name: Test ui-react (unit, types, recipe names, Tailwind coverage)
        # Own vitest runner (its tsconfig has jsx); needs dist/ from the build above.
        run: yarn workspace @duydpdev/ui-react test

      - name: Build examples
        # react-v4 is already built by the site build above.
        run: |
          yarn workspace next-v4-example build
          yarn workspace nuxt-v4-example build

      - name: Check externals
        run: yarn check:externals

      - name: Check browser-safe subpaths
        run: yarn check:browser-safe

      - name: Check size budgets
        run: yarn check:sizes

      - name: Smoke-run built artifacts
        # Loads every subpath via import + require, runs the CLI and the
        # TypeScript generator script that `style-gen init` scaffolds.
        run: yarn check:smoke

      - name: Check types resolve for ESM and CJS (attw, node16 profile)
        # Packs the package and runs @arethetypeswrong/cli on the tarball;
        # needs dist/*.d.cts from `yarn build:all`.
        run: yarn check:types-pack

      - name: Vite dev-server smoke (styleGenVite configureServer)
        # `vite build` never runs configureServer; this edits the example
        # theme under a real dev server and expects a re-emit + full-reload.
        run: node scripts/vite-dev-smoke.mjs

      - name: Type-check dist/*.d.ts (ESM, Bundler) and dist/*.d.cts (CJS, node16) with library checking on
        # tsconfig.dts-check.json and tsconfig.dts-check.cjs.json; attw
        # (above) never resolves peer types. The examples set skipLibCheck.
        run: yarn typecheck:dist

      - name: Test (with coverage thresholds)
        # vitest.config.ts coverage.thresholds fail the step if coverage drops.
        run: yarn test:coverage

      - name: Type tests
        run: yarn test:types
