# ─────────────────────────────────────────────────────
# Release — Orchestrator chính
#
# Trigger: push vào main hoặc develop
# Flow:
#   1. Semantic-release tạo tag & version bump
#   2. Detect tag mới (so sánh trước/sau)
#   3. Gọi deploy.yml để build & publish lên GitHub Packages
#   4. Gọi back-merge.yml sau mọi push vào main (kể cả khi không có release)
# ─────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main, develop]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

# One release run per branch at a time. A running release is never cancelled
# (that could leave a tag pushed without its publish); GitHub keeps one pending
# run per group, so a newer push replaces an older pending one, and that newer
# run releases a superset of the commits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Tạo tag ────────────────────────────────────
  release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_release_published: ${{ steps.check.outputs.new_release_published }}
      new_release_tag: ${{ steps.check.outputs.new_release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_WORKER_REPOSITORY_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        # Semantic Release commits the changelog; local git hooks must not run in CI.
        env:
          HUSKY: "0"
        run: yarn install --immutable

      # Nothing blocks a merge while CI is red (GitHub Free, no branch
      # protection), so test the pushed commit before a tag is cut for it.
      - name: Test
        run: yarn test

      - name: Type tests
        run: yarn test:types

      - name: Save tags before release
        run: git tag > /tmp/tags_before.txt

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.CI_WORKER_REPOSITORY_TOKEN }}
        run: yarn release

      - name: Check for new release
        id: check
        run: |
          git fetch --tags --force origin
          git tag > /tmp/tags_after.txt
          NEW_TAG=$(comm -13 <(sort /tmp/tags_before.txt) <(sort /tmp/tags_after.txt) | head -1)
          if [ -n "$NEW_TAG" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_tag=$NEW_TAG" >> $GITHUB_OUTPUT
            echo "✅ New release: $NEW_TAG"
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No new release"
          fi

  # ── 2. Build & Publish ────────────────────────────
  deploy:
    name: Deploy
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.new_release_tag }}
    secrets: inherit

  # ── 3. Back-merge (mọi push vào main, có hay không có release) ──
  # Features land on develop and main separately, so a push to main that cuts
  # no release (a [ci]/[docs] feature) still leaves main ahead of develop.
  # Run after every successful release job on main; deploy may be skipped (no
  # tag) but must not have failed.
  back-merge:
    name: Back-merge
    needs: [release, deploy]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.release.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.deploy.result)
    uses: ./.github/workflows/back-merge.yml
    with:
      version: ${{ needs.release.outputs.new_release_tag }}
    secrets: inherit
