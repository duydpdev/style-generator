# ─────────────────────────────────────────────────────
# Drift — cảnh báo khi main có commit mà develop chưa có
#
# Back-merge (release.yml → back-merge.yml) chạy sau mọi push vào main. Job này
# bắt trường hợp back-merge fail hoặc không chạy: fail khi develop thiếu commit
# của main quá 60 phút (bỏ qua khoảng thời gian một run release đang chạy).
#
# Giới hạn: đếm commit không bắt được "revert trap". Một feature đã bị revert
# trên develop rồi merge vào main với cùng SHA thì back-merge không mang gì về,
# develop thiếu code mà số đếm vẫn là 0. Chỉ luật `git rebase --force-rebase
# origin/main` trước khi feature land lại (documents/deploy.md) chặn được.
# ─────────────────────────────────────────────────────
name: Drift

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: develop contains main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check develop..main
        run: |
          git fetch origin main develop
          COUNT="$(git rev-list --count origin/develop..origin/main)"
          echo "main commits missing from develop: $COUNT"
          [ "$COUNT" -eq 0 ] && exit 0
          AGE=$(( $(date +%s) - $(git log -1 --format=%ct origin/main) ))
          git log --oneline origin/develop..origin/main
          if [ "$AGE" -lt 3600 ]; then
            echo "main tip is ${AGE}s old; a release/back-merge may still be running"
            exit 0
          fi
          echo "::error::develop is missing $COUNT commit(s) of main for over 60 minutes; run back-merge by hand (documents/deploy.md)"
          exit 1
