# ─────────────────────────────────────────────────────
# CI Matrix — heavy tier: Tailwind floor, Node floor, peer matrix, UI-kit floors
#
# Runs nightly on the default branch, on manual dispatch and on PRs into
# main / release/** (not on PRs into develop). The per-PR tier (check,
# plain-react, e2e, storybook, pr-title) lives in ci.yml. A workflow-level
# `paths-ignore` skips the PR run when a PR only changes documents/**.
# On PRs, every job skips draft PRs; `ready_for_review` runs them when the
# PR leaves draft. `schedule` and `workflow_dispatch` runs have no draft.
# ─────────────────────────────────────────────────────
name: CI Matrix

on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "documents/**"
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

# Own group: cancelling a stale matrix run never cancels ci.yml's `check`.
concurrency:
  group: ci-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The published peer range is `tailwindcss ^4.1.0`, but the lockfile pins
  # 4.3.0, so the floor is otherwise never exercised. This leg re-resolves the
  # Tailwind packages to the latest 4.1.x via `resolutions` (edited in this
  # runner's checkout only — the committed package.json/yarn.lock are not
  # changed) and runs the unit + e2e suites against it.
  tailwind-floor:
    name: Tailwind peer floor (4.1.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Pin Tailwind packages to the 4.1.x floor
        run: |
          jq '.resolutions += {
            "tailwindcss": "~4.1.0",
            "@tailwindcss/node": "~4.1.0",
            "@tailwindcss/vite": "~4.1.0",
            "@tailwindcss/postcss": "~4.1.0"
          }' package.json > package.json.tmp
          mv package.json.tmp package.json
          yarn install --no-immutable
          yarn why tailwindcss
          yarn why @tailwindcss/node

      - name: Build
        run: yarn build:all

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium webkit

      - name: Unit tests
        run: yarn test

      - name: E2E tests
        run: yarn test:e2e

  # `engines.node` is `^20.19.0 || >=22.12.0`, while every other job runs
  # Node 22. This leg loads the built package on the floor release: every
  # subpath via import + require (the CJS entries `require` ESM-only
  # chokidar 5, unflagged only from 20.19) and the CLI, `init` included.
  node-floor:
    name: Node engines floor (20.19.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Smoke-run built artifacts
        run: yarn check:smoke

  # The `vite` and `typescript` peer ranges (CI-05). Each leg re-resolves ONE
  # peer to the latest release of one major via `resolutions` (this runner's
  # checkout only), after the library is built with the committed toolchain,
  # so a red leg names exactly one major. The leg then runs what a consumer on
  # that major runs: the react-v4 example built through `styleGenVite`, a dev
  # server re-emitting on a theme edit, the example and `dist/*.d.ts`
  # type-checked and, for TypeScript, the type tests. Every leg is a
  # published major and must pass (TypeScript 7 has no leg: Yarn 4.10's
  # compat patch cannot install it). ci.yml's `check` job covers the
  # lockfile's Vite 7/TS 5.
  peer-matrix:
    name: Peer matrix (${{ matrix.peer }} ${{ matrix.major }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { peer: vite, major: 5 }
          - { peer: vite, major: 6 }
          - { peer: vite, major: 8 }
          - { peer: typescript, major: 6 }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Re-resolve ${{ matrix.peer }} to the latest ${{ matrix.major }}.x
        env:
          PEER: ${{ matrix.peer }}
          MAJOR: ${{ matrix.major }}
        run: |
          jq --arg peer "$PEER" --arg range "^$MAJOR.0.0" \
            '.resolutions[$peer] = $range' package.json > package.json.tmp
          mv package.json.tmp package.json
          yarn install --no-immutable
          yarn why "$PEER"
          # A red leg must mean "this major fails", never "the old copy ran":
          # the version seen from the root and from the example must be N.x.
          for ws in . examples/react-v4; do
            got=$(cd "$ws" && node -p "require('$PEER/package.json').version")
            echo "$ws: $PEER $got"
            case "$got" in "$MAJOR".*) ;; *) echo "::error::$ws resolved $PEER $got, expected $MAJOR.x"; exit 1 ;; esac
          done

      - name: Build the react-v4 example (styleGenVite)
        run: yarn workspace react-v4-example build

      - name: Vite dev-server smoke (styleGenVite configureServer)
        if: matrix.peer == 'vite'
        run: node scripts/vite-dev-smoke.mjs

      - name: Type-check the react-v4 example against dist
        run: yarn workspace react-v4-example typecheck

      - name: Type-check dist/*.d.ts (ESM, Bundler) and dist/*.d.cts (CJS, node16) with library checking on
        # The example sets skipLibCheck, so it never checks the package's own
        # declarations (or the vite/zod types they reference).
        run: yarn typecheck:dist

      - name: Type tests
        if: matrix.peer == 'typescript'
        run: yarn test:types

  # The floors of the four optional UI-kit peer ranges (`./ui`,
  # `./ui-react`). `peer-matrix` tests latest majors of vite/typescript;
  # nothing else would ever install the OLDEST version a consumer may
  # have. The job builds with the committed toolchain, then forces each
  # peer to the exact floor through `resolutions` (this runner's checkout
  # only), proves the install picked the floor, and runs what a consumer
  # of the kit runs: the `dist/*.d.ts` + `dist/*.d.cts` type-check and
  # the kit's unit tests. It fails when a floor stops being the minimum
  # of the range in package.json, so range and job cannot drift.
  # Two harness-only pins mirror what a consumer actually gets: cva 0.7.0
  # needs clsx 2.0.0 exactly, so it keeps its own nested copy, and
  # @types/scheduler is held at 0.16.8, the last version with
  # `scheduler/tracing`, which @types/react <=18.2.71 imports.
  ui-peer-floor:
    name: UI-kit peer floors (cva 0.7.0, clsx 1.2.0, tailwind-merge 3.0.0, @types/react 18.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      FLOORS: '{"class-variance-authority":"0.7.0","clsx":"1.2.0","tailwind-merge":"3.0.0","@types/react":"18.0.0"}'
      HARNESS_PINS: '{"class-variance-authority/clsx":"2.0.0","@types/scheduler":"0.16.8"}'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Check that each floor is the minimum of its peer range
        run: |
          node -e '
            const semver = require("semver");
            const peers = require("./package.json").peerDependencies;
            let bad = false;
            for (const [name, floor] of Object.entries(JSON.parse(process.env.FLOORS))) {
              const min = semver.minVersion(peers[name]).version;
              console.log(name, peers[name], "min", min, "floor", floor);
              if (min !== floor) { console.error("::error::" + name + " range " + peers[name] + " has minimum " + min + ", the job pins " + floor); bad = true; }
            }
            process.exit(bad ? 1 : 0);
          '

      - name: Re-resolve the four peers to their floors
        run: |
          jq --argjson pins "$HARNESS_PINS" --argjson floors "$FLOORS" '.resolutions = (.resolutions + $pins + $floors)' package.json > package.json.tmp
          mv package.json.tmp package.json
          yarn install --no-immutable
          # A red job must mean "the floor fails", never "the lockfile copy ran":
          node -e '
            const { readFileSync } = require("fs");
            const { resolve } = require("path");
            for (const [name, floor] of Object.entries(JSON.parse(process.env.FLOORS))) {
              const got = JSON.parse(readFileSync(resolve("node_modules", name, "package.json"), "utf8")).version;
              console.log(name, got);
              if (got !== floor) { console.error("::error::resolved " + name + " " + got + ", expected " + floor); process.exit(1); }
            }
            for (const [path, expected] of [["class-variance-authority/node_modules/clsx", "2.0.0"], ["@types/scheduler", "0.16.8"]]) {
              const got = JSON.parse(readFileSync(resolve("node_modules", path, "package.json"), "utf8")).version;
              console.log(path, got);
              if (got !== expected) { console.error("::error::resolved " + path + " " + got + ", expected " + expected); process.exit(1); }
            }
          '

      - name: Type-check dist/*.d.ts (ESM, Bundler) and dist/*.d.cts (CJS, node16) with library checking on
        run: yarn typecheck:dist

      - name: Kit unit tests
        run: yarn vitest run src/features/ui

      - name: Load dist/ui.cjs at the peer floors (CJS runtime)
        run: |
          # The unit tests above run the ESM sources; this requires the built CJS entry,
          # which resolves cva, clsx and tailwind-merge at their floors.
          node -e '
            const ui = require("./dist/ui.cjs");
            if (typeof ui.createCn !== "function" || typeof ui.recipeFromTables !== "function") process.exit(1);
            const cn = ui.createCn({ typography: ["heading1"], shadows: ["card"], backDropBlurs: [], borderRadius: ["pill"], borderWidth: ["thin"] });
            if (cn("rounded-lg", "rounded-pill") !== "rounded-pill") process.exit(1);
            if (ui.recipeFromTables({ base: "flex", variants: {} })() !== "flex") process.exit(1);
          '
