# ─────────────────────────────────────────────────────
# Deploy — Build & publish the package to the public npm registry (registry.npmjs.org)
#
# Reusable workflow, called from release.yml. Run it by hand (workflow_dispatch)
# to publish a tag that was pushed but not yet published (runbook: documents/deploy.md).
#
# Auth is npm trusted publishing (OIDC): no NPM_TOKEN secret. The package's
# Trusted Publisher on npmjs.com names the workflow that STARTS the run, so a
# publish from release.yml needs `release.yml` registered and a manual dispatch
# of this file needs `deploy.yml` registered as well.
# Input: tag name (e.g. v1.2.0 or v1.2.0-DEV.1)
# ─────────────────────────────────────────────────────
name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to checkout and publish (e.g. v1.2.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.2.0 or v1.2.0-DEV.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  deploy:
    name: Build & Publish Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          # No git operation follows the checkout; keep no token in .git/config
          # while dependency install scripts run.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      # A DEV release commits nothing to develop (release.config.cjs), so the
      # package.json at a DEV tag still carries the last stable version. Set the
      # version from the tag for every channel (a no-op on main, where the
      # release commit already has it); the change stays in the runner.
      - name: Set version from tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then echo "::error::inputs.tag is empty"; exit 1; fi
          VERSION="${TAG#v}"
          npm pkg set version="$VERSION"
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::package.json version $ACTUAL does not match tag $TAG"
            exit 1
          fi
          echo "Publishing version $VERSION"

      - name: Build
        run: yarn build:all

      - name: Verify externals (dist must not inline peer/dep packages)
        run: yarn check:externals

      - name: Verify package types (attw on the packed tarball)
        # Needs dist/*.d.cts from `yarn build:all`.
        run: yarn check:types-pack

      - name: Verify peer types in dist (typecheck the built .d.ts)
        # Only check of dist/*.d.ts / *.d.cts against the peer ranges.
        run: yarn typecheck:dist

      # The tag's build must run: every subpath loads in ESM and CJS, and
      # `style-gen --version` prints the version set from the tag above.
      - name: Smoke-test the built package
        run: yarn check:smoke

      - name: Verify browser-safe subpaths
        run: yarn check:browser-safe

      - name: Verify publish target = npmjs.org (registry.npmjs.org)
        run: yarn check:publish-target

      # The dry-run prints the target registry; assert it from the output so a
      # config drift cannot send the package elsewhere.
      - name: Publish dry-run (assert registry from output)
        run: |
          set -o pipefail
          OUT=$(yarn npm publish --dry-run 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -F "Package would be published to https://registry.npmjs.org" \
            || { echo "::error::Dry-run did not target https://registry.npmjs.org"; exit 1; }

      - name: Publish to npm
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            yarn npm publish --provenance --tag DEV
          else
            yarn npm publish --provenance
          fi
