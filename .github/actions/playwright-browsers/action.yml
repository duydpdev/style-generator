name: Install Playwright browsers (cached)
description: >
  Restores Chromium + WebKit from the cache keyed on the installed
  @playwright/test version; downloads them on a miss. The OS packages the
  browsers need are not in the cache, so they are installed on a hit too.
  Requires `yarn install` to have run first.

runs:
  using: composite
  steps:
    - name: Resolve Playwright version and runner image
      id: version
      shell: bash
      # ImageOS (ubuntu24, …) is in the key because Playwright ships one WebKit
      # build per Ubuntu release but unpacks all of them into the same
      # directory; a cache from an older image would hit and fail to launch.
      run: |
        echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.version.outputs.image }}-${{ steps.version.outputs.version }}-chromium-webkit

    - name: Download browsers and OS dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: yarn playwright install --with-deps chromium webkit

    - name: Install OS dependencies only
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: yarn playwright install-deps chromium webkit
