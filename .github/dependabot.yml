version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Dependabot cuts its branch from the target branch. Features are cut from
    # develop (documents/deploy.md), so target develop: the PR lands there and
    # reaches main with the next develop -> main release PR.
    target-branch: develop
    schedule:
      interval: monthly
    # No automatic rebase: every rebase re-runs the whole CI on the PR.
    # Comment `@dependabot rebase` on the PR to update it before landing.
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      # Trailing space on purpose: GitHub inserts a colon after a prefix that
      # ends with `]`, and `[ci]: bump …` fails the `[type] subject` header rule
      # that the PR title check and commitlint enforce.
      prefix: "[ci] "

  - package-ecosystem: npm
    directory: /
    # Same flow as github-actions above: branch from develop, one PR. Covers the
    # root package and every workspace in the lockfile.
    target-branch: develop
    schedule:
      interval: monthly
    # Same as github-actions above.
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      # Report §3.6 item 4: every minor/patch bump in ONE PR. Majors are not
      # grouped, so each gets its own PR (the ignore list below still drops
      # the hand-managed majors).
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors that change a supported range are done by hand: the Tailwind
      # and Zod lines (tailwind-floor leg), the vite/typescript peers
      # (peer matrix, CI-05) and the optional peers of `./ui` (`@types/react`,
      # `class-variance-authority`, `clsx`, `tailwind-merge`). Minor and patch
      # bumps still come through.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "class-variance-authority"
        update-types: ["version-update:semver-major"]
      - dependency-name: "clsx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
    commit-message:
      # `[ci]` cuts no release. The root's runtime ranges are carets, so an
      # in-range bump only moves yarn.lock, which is not published: consumers
      # resolve their own versions. A bump that changes a published range
      # (package.json `dependencies`/`peerDependencies`) must be retitled to
      # `[fix]`/`[feat]` before merging so the new range is released.
      prefix: "[ci] "
