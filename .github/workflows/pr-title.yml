# ─────────────────────────────────────────────────────
# PR Title — lint the PR title with commitlint.config.ts
#
# Features land on develop and main through merge commits: the first line is
# `Merge pull request #N …` (ignored by the analyzer), and the PR title lives
# only in the body. The headers of the commits on the branch decide the release
# (linted in ci.yml). This check keeps the PR title readable and consistent
# with those headers.
# `edited` also catches a title-only edit (ci.yml does not re-run then).
# Does not run on `synchronize`: pushing a new commit does not change the title.
# Consequence: the check attaches only to the head at the time it ran; commits
# pushed afterwards do not carry this check (it is not a required check of the
# rulesets, so it does not block the merge).
# The "Check branch name" step checks the head branch name with
# scripts/check-branch-name.sh, the same rule as .husky/pre-push.
# ─────────────────────────────────────────────────────
name: PR Title

on:
  pull_request:
    branches: [main, develop, "release/**"]
    types: [opened, edited, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: PR title (commitlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check branch name
        # Same rule as .husky/pre-push (scripts/check-branch-name.sh); runs
        # before the install so a bad name fails in seconds. The head ref goes
        # through env, never interpolated into the script.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: sh scripts/check-branch-name.sh "$HEAD_REF"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: yarn install --immutable

      - name: Lint PR title
        # The title goes through env, never interpolated into the script, so a
        # crafted title cannot inject shell. commitlint.pr-title.config.ts turns
        # off the default ignores, so `Revert "…"` / `Merge …` titles fail too.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | yarn commitlint --config commitlint.pr-title.config.ts --verbose
